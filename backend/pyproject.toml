[project]
name = "onboardflow-backend"
version = "0.1.0"
description = "OnboardFlow AI Python backend service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17.2",
  "email-validator>=2.3.0",
  "fastapi>=0.128.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.10.1,<2.11",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.45",
  "uvicorn>=0.38.0",
]

[project.optional-dependencies]
crewai = [
  "crewai>=1.7.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
